name: Build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    name: Node ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [
            22.x, # EOL: April 2027
          ]

    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        env:
          NODE_VERSION: ${{ matrix.node_version }}
        run: |
          curl -sL https://deb.nodesource.com/setup_$NODE_VERSION | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: remove non system node
        run: |
          sudo rm /usr/local/bin/node # we have node, nuke the foreign version from the actions

      - name: versions
        run: |
          which node
          node --version
          yarn --version

      - name: Build package
        run: ./build-package

      - name: Install package
        run: sudo dpkg -i deb/*.deb

      - name: Test
        run: ./tests.sh

      - name: Journal
        run: sudo systemctl --full status thelounge.service

      - name: Upload artifact
        if: ${{ matrix.node_version == '22.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: thelounge.deb
          path: deb/*.deb

      - name: Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.node_version == '22.x' }}
        uses: softprops/action-gh-release@v2
        with:
          files: deb/*.deb
